services:
	postgres:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: hms
			POSTGRES_USER: hms
			POSTGRES_PASSWORD: hms
		ports:
			- "5432:5432"
		volumes:
			- hms-postgres-data:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
			interval: 5s
			timeout: 5s
			retries: 10

	redis:
		image: redis:7-alpine
		ports:
			- "6379:6379"
		volumes:
			- hms-redis-data:/data
		healthcheck:
			test: ["CMD", "redis-cli", "ping"]
			interval: 5s
			timeout: 3s
			retries: 10

volumes:
	hms-postgres-data:
	hms-redis-data:
